name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libgtk-3-0 libgbm1 libasound2 libxss1 libxtst6

      - name: E2E tests (headless Electron via xvfb)
        run: xvfb-run -a npx playwright test
        env:
          CI: '1'

  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Package (Windows NSIS)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis
        env:
          # Signed installers require these secrets (see docs/RELEASE-CHECKLIST.md):
          # CSC_LINK / CSC_KEY_PASSWORD — base64 p12 + password.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package (macOS zip + dmg)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac zip dmg
        env:
          # Signed/notarized builds require (see docs/RELEASE-CHECKLIST.md):
          # CSC_LINK / CSC_KEY_PASSWORD — Developer ID p12 + password.
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID — notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nepal-passport-helper-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub release (tags)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Structured for auto-update: the blockmap files alongside the
      # installers are what electron-updater consumes. `publish: null` stays
      # for local builds; this job is the only publish step.
      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
