name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Electron runtime libraries
        run: npx playwright install-deps

      - name: E2E tests (headless Electron via xvfb)
        run: xvfb-run -a npx playwright test
        env:
          CI: '1'

  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Each main build must compare greater than the previous installed build.
      # major/minor come from package.json; the workflow run number is the patch.
      - name: Set release version
        shell: bash
        run: |
          VERSION="$(node -p "const [major,minor]=require('./package.json').version.split('.'); major+'.'+minor+'.'+process.env.GITHUB_RUN_NUMBER")"
          npm version --no-git-tag-version "$VERSION"

      - name: Build
        run: npm run build

      - name: Package (Windows NSIS)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never --config.publish.provider=github --config.publish.owner=${{ github.repository_owner }} --config.publish.repo=${{ github.event.repository.name }}
        env:
          # Signed installers require these secrets (see docs/RELEASE-CHECKLIST.md):
          # CSC_LINK / CSC_KEY_PASSWORD — base64 p12 + password.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package (macOS zip + dmg)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac zip dmg --x64 --arm64 --publish never --config.publish.provider=github --config.publish.owner=${{ github.repository_owner }} --config.publish.repo=${{ github.event.repository.name }}
        env:
          # Signed/notarized builds require (see docs/RELEASE-CHECKLIST.md):
          # CSC_LINK / CSC_KEY_PASSWORD — Developer ID p12 + password.
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID — notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nepal-passport-helper-${{ runner.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.blockmap
            release/latest.yml
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/checkout@v5

      - name: Publish installers and updater metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "const [major,minor]=require('./package.json').version.split('.'); major+'.'+minor+'.'+process.env.GITHUB_RUN_NUMBER")"
          gh release create "v$VERSION" artifacts/* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
